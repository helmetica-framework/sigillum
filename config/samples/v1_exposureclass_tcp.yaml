apiVersion: seals.helmetica.io/v1
kind: ExposureClass
metadata:
  name: tcp
spec:
  type: Gateway
  supports:
    - TCP
  shardSelector:
    matchLabels:
      sigillum.io/shard-pool: tcp
  portRange:
    from: 30000
    to: 30255
  maxListenersPerShard: 64
  gatewaySelector:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: istio-system
    # Istio runs one proxy per shard Gateway and labels its pods with the
    # Gateway's name.
    podSelector:
      matchExpressions:
        - key: gateway.networking.k8s.io/gateway-name
          operator: Exists
