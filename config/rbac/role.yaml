---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gateways
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - listenersets
  - tcproutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - listenersets/status
  - tcproutes/status
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - seals.helmetica.io
  resources:
  - exposureclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - seals.helmetica.io
  resources:
  - seals
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - seals.helmetica.io
  resources:
  - seals/status
  verbs:
  - get
  - patch
  - update
